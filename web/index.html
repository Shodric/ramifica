<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Vertical interactive video. A narrator asks which decision the protagonist should take, and you choose by holding a point on the scene for one second.">
  <meta name="theme-color" content="#131318">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ramifica">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ramifica</title>
  <link rel="manifest" href="manifest.webmanifest">

  <style>
    html, body {
      height: 100dvh;
      margin: 0;
      overscroll-behavior: none;
      background: #131318;
    }

    body {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    video {
      pointer-events: none;
    }
  </style>
</head>
<body>
  <script>
    // Debug App Check on localhost only. Production hostnames must not set this.
    if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
      self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
    }
  </script>
  <script>
    // First user gesture, visible to the app: a login tap counts, so the
    // first clip after login can start with sound.
    addEventListener("pointerdown", function () {
      window.__ramificaGestured = true;
    }, {capture: true, passive: true});
  </script>
  <script>
    // A hold is a choice. The browser must not turn it into a callout.
    document.addEventListener("contextmenu", function (event) {
      event.preventDefault();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
